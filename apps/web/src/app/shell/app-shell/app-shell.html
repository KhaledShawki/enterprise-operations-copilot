<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="shell">
  <aside class="navigation" aria-label="Primary navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">EO</span>
      <span class="brand-name">EOC</span>
    </div>

    <nav class="navigation-items" aria-label="Workspace">
      @if (activeTenant(); as tenant) {
        <a
          class="navigation-item"
          [routerLink]="['/t', tenant.tenantKey, 'receivables']"
          routerLinkActive="navigation-item-active"
          ariaCurrentWhenActive="page"
        >
          <span class="navigation-indicator" aria-hidden="true"></span>
          Receivables
        </a>
      }
    </nav>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="product-name">Enterprise Operations Copilot</p>
        <p class="product-context">{{ activeTenant()?.displayName ?? 'Tenant workspace' }}</p>
      </div>

      <div class="session-controls">
        <label class="tenant-control" for="tenant-switcher">
          <span class="product-context">Tenant</span>
          <select id="tenant-switcher" [value]="activeTenant()?.tenantKey ?? ''" (change)="onTenantChange($event)">
            @for (tenant of tenants(); track tenant.tenantId) {
              <option [value]="tenant.tenantKey">{{ tenant.displayName }}</option>
            }
          </select>
        </label>

        @if (csrf(); as token) {
          <form method="post" action="/logout">
            <input type="hidden" [name]="token.parameterName" [value]="token.token" />
            <button class="sign-out" type="submit">Sign out</button>
          </form>
        }
      </div>
    </header>

    <main id="main-content" class="content" tabindex="-1" data-route-focus>
      <router-outlet (activate)="focusMainContent()" />
    </main>
  </div>
</div>
