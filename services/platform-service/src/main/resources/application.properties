spring.application.name=platform-service

spring.datasource.url=${EOC_DATASOURCE_URL}
spring.datasource.username=${EOC_DATASOURCE_USERNAME}
spring.datasource.password=${EOC_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

eoc.connector-outbox.relay-enabled=${EOC_CONNECTOR_OUTBOX_RELAY_ENABLED:false}
eoc.connector-outbox.batch-size=${EOC_CONNECTOR_OUTBOX_BATCH_SIZE:1}
eoc.connector-outbox.claim-lease-seconds=${EOC_CONNECTOR_OUTBOX_CLAIM_LEASE_SECONDS:30}
eoc.connector-outbox.initial-delay-ms=${EOC_CONNECTOR_OUTBOX_INITIAL_DELAY_MS:5000}
eoc.connector-outbox.fixed-delay-ms=${EOC_CONNECTOR_OUTBOX_FIXED_DELAY_MS:1000}

eoc.connector-events.transport=${EOC_CONNECTOR_EVENTS_TRANSPORT:local}
eoc.connector-events.kafka.topic=${EOC_CONNECTOR_EVENTS_KAFKA_TOPIC:eoc.connector.integration-events}
eoc.connector-events.kafka.send-timeout=${EOC_CONNECTOR_EVENTS_KAFKA_SEND_TIMEOUT:10s}
eoc.connector-events.kafka.consumer.enabled=${EOC_CONNECTOR_EVENTS_KAFKA_CONSUMER_ENABLED:true}
eoc.connector-events.kafka.consumer.group-id=${EOC_CONNECTOR_EVENTS_KAFKA_CONSUMER_GROUP_ID:eoc-platform-connector-events-v1}
eoc.connector-events.kafka.consumer.dlt-topic=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC:eoc.connector.integration-events.dlt}
eoc.connector-events.kafka.consumer.max-attempts=${EOC_CONNECTOR_EVENTS_KAFKA_MAX_ATTEMPTS:4}
eoc.connector-events.kafka.consumer.retry-backoff=${EOC_CONNECTOR_EVENTS_KAFKA_RETRY_BACKOFF:1s}
eoc.connector-events.kafka.consumer.dlt-send-timeout=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_SEND_TIMEOUT:10s}
eoc.connector-events.kafka.consumer.max-event-bytes=${EOC_CONNECTOR_EVENTS_KAFKA_MAX_EVENT_BYTES:1048576}
eoc.connector-events.kafka.consumer.concurrency=${EOC_CONNECTOR_EVENTS_KAFKA_CONSUMER_CONCURRENCY:3}
eoc.connector-events.kafka.dead-letter-recovery.enabled=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_RECOVERY_ENABLED:false}
eoc.connector-events.kafka.dead-letter-recovery.inspection-timeout=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_INSPECTION_TIMEOUT:3s}
eoc.connector-events.kafka.dead-letter-recovery.max-page-size=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_MAX_PAGE_SIZE:20}
eoc.connector-events.kafka.dead-letter-recovery.max-replay-generation=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_MAX_REPLAY_GENERATION:3}
eoc.connector-events.kafka.dead-letter-recovery.max-attempts=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_MAX_ATTEMPTS:5}
eoc.connector-events.kafka.dead-letter-recovery.retry-delay=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_RETRY_DELAY:30s}
eoc.connector-events.kafka.dead-letter-recovery.batch-size=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_BATCH_SIZE:1}
eoc.connector-events.kafka.dead-letter-recovery.claim-lease=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_CLAIM_LEASE:30s}
eoc.connector-events.kafka.dead-letter-recovery.initial-delay-ms=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_INITIAL_DELAY_MS:5000}
eoc.connector-events.kafka.dead-letter-recovery.fixed-delay-ms=${EOC_CONNECTOR_EVENTS_KAFKA_DLT_REPLAY_FIXED_DELAY_MS:1000}

eoc.operations-outbox.relay-enabled=${EOC_OPERATIONS_OUTBOX_RELAY_ENABLED:false}
eoc.operations-outbox.batch-size=${EOC_OPERATIONS_OUTBOX_BATCH_SIZE:1}
eoc.operations-outbox.claim-lease=${EOC_OPERATIONS_OUTBOX_CLAIM_LEASE:30s}
eoc.operations-outbox.max-attempts=${EOC_OPERATIONS_OUTBOX_MAX_ATTEMPTS:5}
eoc.operations-outbox.retry-delay=${EOC_OPERATIONS_OUTBOX_RETRY_DELAY:1m}
eoc.operations-outbox.initial-delay-ms=${EOC_OPERATIONS_OUTBOX_INITIAL_DELAY_MS:5000}
eoc.operations-outbox.fixed-delay-ms=${EOC_OPERATIONS_OUTBOX_FIXED_DELAY_MS:1000}

eoc.operations-events.transport=${EOC_OPERATIONS_EVENTS_TRANSPORT:disabled}
eoc.operations-events.kafka.topic=${EOC_OPERATIONS_EVENTS_KAFKA_TOPIC:eoc.operations.integration-events}
eoc.operations-events.kafka.send-timeout=${EOC_OPERATIONS_EVENTS_KAFKA_SEND_TIMEOUT:10s}

eoc.kafka.producer.max-block-timeout=${EOC_KAFKA_PRODUCER_MAX_BLOCK_TIMEOUT:5s}

spring.kafka.bootstrap-servers=${EOC_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.client-id=${EOC_KAFKA_CONSUMER_CLIENT_ID:eoc-connector-inbox}
spring.kafka.consumer.group-id=${EOC_CONNECTOR_EVENTS_KAFKA_CONSUMER_GROUP_ID:eoc-platform-connector-events-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=${EOC_KAFKA_MAX_POLL_RECORDS:50}
spring.kafka.consumer.max-poll-interval=${EOC_KAFKA_MAX_POLL_INTERVAL:5m}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.type=single
spring.kafka.listener.ack-mode=record
spring.kafka.listener.observation-enabled=true
spring.kafka.producer.client-id=${EOC_KAFKA_PRODUCER_CLIENT_ID:eoc-platform-outbox}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.in.flight.requests.per.connection]=5
spring.kafka.producer.properties[delivery.timeout.ms]=${EOC_KAFKA_DELIVERY_TIMEOUT_MS:8000}
spring.kafka.producer.properties[request.timeout.ms]=${EOC_KAFKA_REQUEST_TIMEOUT_MS:3000}
spring.kafka.template.observation-enabled=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

spring.security.oauth2.resourceserver.jwt.issuer-uri=${EOC_SECURITY_ISSUER_URI:http://localhost:8180/realms/eoc}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${EOC_SECURITY_JWK_SET_URI:http://localhost:8180/realms/eoc/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${EOC_SECURITY_AUDIENCE:platform-api}
