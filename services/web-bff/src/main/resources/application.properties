spring.application.name=web-bff
server.port=${EOC_WEB_BFF_HTTP_PORT:8081}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=EOC_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${EOC_WEB_BFF_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

eoc.web-bff.oidc.client-id=eoc-web
eoc.web-bff.oidc.client-secret=${EOC_WEB_BFF_CLIENT_SECRET}
eoc.web-bff.oidc.issuer-uri=${EOC_WEB_BFF_ISSUER_URI:http://localhost:8180/realms/eoc}
eoc.web-bff.oidc.authorization-uri=${EOC_WEB_BFF_AUTHORIZATION_URI:http://localhost:8180/realms/eoc/protocol/openid-connect/auth}
eoc.web-bff.oidc.token-uri=${EOC_WEB_BFF_TOKEN_URI:http://localhost:8180/realms/eoc/protocol/openid-connect/token}
eoc.web-bff.oidc.jwk-set-uri=${EOC_WEB_BFF_JWK_SET_URI:http://localhost:8180/realms/eoc/protocol/openid-connect/certs}
eoc.web-bff.oidc.end-session-uri=${EOC_WEB_BFF_END_SESSION_URI:http://localhost:8180/realms/eoc/protocol/openid-connect/logout}
eoc.web-bff.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
eoc.web-bff.platform-api.base-url=${EOC_WEB_BFF_PLATFORM_API_BASE_URL:http://localhost:8080}

spring.http.clients.connect-timeout=${EOC_WEB_BFF_HTTP_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${EOC_WEB_BFF_HTTP_READ_TIMEOUT:5s}
spring.http.clients.redirects=dont-follow

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
