name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Keycloak realm JSON
        run: python3 -m json.tool deployment/keycloak/eoc-realm.json >/dev/null

      - name: Validate Docker Compose configuration
        run: >
          docker compose
          --env-file deployment/compose/.env.example
          --file deployment/compose/compose.yaml
          config --quiet

      - name: Validate observability Compose configuration
        run: >
          docker compose
          --env-file deployment/compose/.env.example
          --file deployment/compose/compose.yaml
          --file deployment/compose/compose.observability.yaml
          --profile observability
          config --quiet

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool deployment/observability/grafana/dashboards/eoc-event-pipeline.json >/dev/null

  evidence-lab:
    name: Evidence lab verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Test evidence lab
        env:
          PYTHONPATH: tools/eoc-lab
        run: python -m unittest discover -s tools/eoc-lab/tests -v

      - name: Verify evidence lab CLI
        run: ./scripts/eoc-lab --help >/dev/null

  evidence-lab-system:
    name: Evidence lab system smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [configuration, evidence-lab]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Prepare isolated lab environment
        shell: bash
        run: |
          cp deployment/compose/.env.example deployment/compose/.env
          lab_secret="$(openssl rand -hex 32)"
          sed -i "s/^EOC_LAB_CLIENT_SECRET=.*/EOC_LAB_CLIENT_SECRET=${lab_secret}/" deployment/compose/.env

      - name: Start local platform
        continue-on-error: true
        run: >-
          docker compose
          --env-file deployment/compose/.env
          --file deployment/compose/compose.yaml
          up --detach --build --wait --wait-timeout 240 platform-service web-bff

      - name: Validate lab environment
        continue-on-error: true
        run: ./scripts/eoc-lab doctor

      - name: Execute smoke scenario
        run: ./scripts/eoc-lab run smoke

      - name: Verify generated smoke evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = sorted(Path("evidence/runs").glob("*/result.json"))
          if len(results) != 1:
              raise SystemExit(f"expected one smoke result, found {len(results)}")
          result = json.loads(results[0].read_text(encoding="utf-8"))
          if result.get("status") != "PASS" or result.get("passed") is not True:
              raise SystemExit(f"smoke evidence did not pass: {result}")
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eoc-evidence-lab-smoke-${{ github.run_id }}
          path: evidence/runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local platform
        if: always()
        run: >-
          docker compose
          --env-file deployment/compose/.env
          --file deployment/compose/compose.yaml
          down --volumes --remove-orphans

  container:
    name: Platform service container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build platform service image
        run: >-
          docker build
          --file services/platform-service/Dockerfile
          --tag eoc/platform-service:test
          .

      - name: Verify platform service image
        run: |
          test "$(
            docker image inspect \
              --format '{{.Config.User}}' \
              eoc/platform-service:test
          )" = "10001:10001"
          docker run --rm --entrypoint java eoc/platform-service:test -version

  bff-container:
    name: Web BFF container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Web BFF image
        run: >-
          docker build
          --file services/web-bff/Dockerfile
          --tag eoc/web-bff:test
          .

      - name: Verify Web BFF image
        run: |
          test "$(
            docker image inspect \
              --format '{{.Config.User}}' \
              eoc/web-bff:test
          )" = "10001:10001"
          docker run --rm --entrypoint java eoc/web-bff:test -version

  web:
    name: Web verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web application
        run: npm run lint

      - name: Test web application
        run: npm test

      - name: Build web application
        run: npm run build

  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
