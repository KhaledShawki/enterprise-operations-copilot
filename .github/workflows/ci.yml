name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Keycloak realm JSON
        run: python3 -m json.tool deployment/keycloak/eoc-realm.json >/dev/null

      - name: Validate Docker Compose configuration
        run: >
          docker compose
          --env-file deployment/compose/.env.example
          --file deployment/compose/compose.yaml
          config --quiet

  container:
    name: Platform service container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build platform service image
        run: >-
          docker build
          --file services/platform-service/Dockerfile
          --tag eoc/platform-service:test
          .

      - name: Verify platform service image
        run: |
          test "$(
            docker image inspect \
              --format '{{.Config.User}}' \
              eoc/platform-service:test
          )" = "10001:10001"
          docker run --rm --entrypoint java eoc/platform-service:test -version

  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
