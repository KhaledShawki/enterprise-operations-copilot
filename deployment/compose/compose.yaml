name: eoc

services:
  platform-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: "${PLATFORM_DB_NAME:?PLATFORM_DB_NAME is required}"
      POSTGRES_USER: "${PLATFORM_DB_USERNAME:?PLATFORM_DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}"
      POSTGRES_INITDB_ARGS: "--data-checksums"

    volumes:
      - platform-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - platform

  keycloak-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: "${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}"
      POSTGRES_USER: "${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"
      POSTGRES_INITDB_ARGS: "--data-checksums"

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - identity

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    mem_limit: 1g

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}"

      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"

      KC_HOSTNAME: "http://localhost:8180"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      EOC_WEB_BFF_CLIENT_SECRET: "${EOC_WEB_BFF_CLIENT_SECRET:?EOC_WEB_BFF_CLIENT_SECRET is required}"

      EOC_DEV_USER_USERNAME: "${EOC_DEV_USER_USERNAME:?EOC_DEV_USER_USERNAME is required}"
      EOC_DEV_USER_EMAIL: "${EOC_DEV_USER_EMAIL:?EOC_DEV_USER_EMAIL is required}"
      EOC_DEV_USER_PASSWORD: "${EOC_DEV_USER_PASSWORD:?EOC_DEV_USER_PASSWORD is required}"

    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9000:9000"

    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    networks:
      - identity

  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    networks:
      - platform

  kafka-topic-init:
    image: apache/kafka:4.2.1
    restart: "no"

    environment:
      EOC_CONNECTOR_EVENTS_KAFKA_TOPIC: "${EOC_CONNECTOR_EVENTS_KAFKA_TOPIC:?EOC_CONNECTOR_EVENTS_KAFKA_TOPIC is required}"
      EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC: "${EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC:?EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC is required}"
      EOC_OPERATIONS_EVENTS_KAFKA_TOPIC: "${EOC_OPERATIONS_EVENTS_KAFKA_TOPIC:?EOC_OPERATIONS_EVENTS_KAFKA_TOPIC is required}"
      EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC: "${EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC:?EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC is required}"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$${EOC_CONNECTOR_EVENTS_KAFKA_TOPIC}" \
          --partitions 6 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$${EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC}" \
          --partitions 6 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$${EOC_OPERATIONS_EVENTS_KAFKA_TOPIC}" \
          --partitions 6 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$${EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC}" \
          --partitions 6 \
          --replication-factor 1

    networks:
      - platform

  platform-service:
    image: eoc/platform-service:local

    build:
      context: ../..
      dockerfile: services/platform-service/Dockerfile

    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    environment:
      EOC_DATASOURCE_URL: "jdbc:postgresql://platform-postgres:5432/${PLATFORM_DB_NAME:?PLATFORM_DB_NAME is required}"
      EOC_DATASOURCE_USERNAME: "${PLATFORM_DB_USERNAME:?PLATFORM_DB_USERNAME is required}"
      EOC_DATASOURCE_PASSWORD: "${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}"

      EOC_SECURITY_ISSUER_URI: "http://localhost:8180/realms/eoc"
      EOC_SECURITY_JWK_SET_URI: "http://keycloak:8080/realms/eoc/protocol/openid-connect/certs"
      EOC_SECURITY_AUDIENCE: "platform-api"
      EOC_CONNECTOR_OUTBOX_RELAY_ENABLED: "true"
      EOC_CONNECTOR_EVENTS_TRANSPORT: "kafka"
      EOC_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      EOC_CONNECTOR_EVENTS_KAFKA_TOPIC: "${EOC_CONNECTOR_EVENTS_KAFKA_TOPIC:?EOC_CONNECTOR_EVENTS_KAFKA_TOPIC is required}"
      EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC: "${EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC:?EOC_CONNECTOR_EVENTS_KAFKA_DLT_TOPIC is required}"
      EOC_CONNECTOR_EVENTS_KAFKA_DLT_RECOVERY_ENABLED: "${EOC_CONNECTOR_EVENTS_KAFKA_DLT_RECOVERY_ENABLED:-true}"
      EOC_OPERATIONS_OUTBOX_RELAY_ENABLED: "true"
      EOC_OPERATIONS_EVENTS_TRANSPORT: "kafka"
      EOC_OPERATIONS_EVENTS_KAFKA_TOPIC: "${EOC_OPERATIONS_EVENTS_KAFKA_TOPIC:?EOC_OPERATIONS_EVENTS_KAFKA_TOPIC is required}"
      EOC_ANALYTICS_EVENTS_TRANSPORT: "kafka"
      EOC_ANALYTICS_EVENTS_KAFKA_CONSUMER_ENABLED: "true"
      EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC: "${EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC:?EOC_ANALYTICS_EVENTS_KAFKA_DLT_TOPIC is required}"

      EOC_COPILOT_LLM_ENABLED: "${EOC_COPILOT_LLM_ENABLED:-false}"
      EOC_COPILOT_LLM_PROVIDER: "${EOC_COPILOT_LLM_PROVIDER:-none}"
      EOC_COPILOT_LLM_API_KEY: "${EOC_COPILOT_LLM_API_KEY:-}"
      EOC_COPILOT_LLM_MODEL: "${EOC_COPILOT_LLM_MODEL:-gpt-5-mini}"

    ports:
      - "127.0.0.1:${PLATFORM_HTTP_PORT:?PLATFORM_HTTP_PORT is required}:8080"

    depends_on:
      platform-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully

    networks:
      - platform
      - identity

  web-bff:
    image: eoc/web-bff:local

    build:
      context: ../..
      dockerfile: services/web-bff/Dockerfile

    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    environment:
      EOC_WEB_BFF_CLIENT_SECRET: "${EOC_WEB_BFF_CLIENT_SECRET:?EOC_WEB_BFF_CLIENT_SECRET is required}"
      EOC_WEB_BFF_ISSUER_URI: "http://localhost:8180/realms/eoc"
      EOC_WEB_BFF_AUTHORIZATION_URI: "http://localhost:8180/realms/eoc/protocol/openid-connect/auth"
      EOC_WEB_BFF_TOKEN_URI: "http://keycloak:8080/realms/eoc/protocol/openid-connect/token"
      EOC_WEB_BFF_JWK_SET_URI: "http://keycloak:8080/realms/eoc/protocol/openid-connect/certs"
      EOC_WEB_BFF_END_SESSION_URI: "http://localhost:8180/realms/eoc/protocol/openid-connect/logout"
      EOC_WEB_BFF_PLATFORM_API_BASE_URL: "http://platform-service:8080"
      EOC_WEB_BFF_SESSION_COOKIE_SECURE: "${EOC_WEB_BFF_SESSION_COOKIE_SECURE:-false}"

    ports:
      - "127.0.0.1:${WEB_BFF_HTTP_PORT:?WEB_BFF_HTTP_PORT is required}:8081"

    depends_on:
      keycloak:
        condition: service_healthy
      platform-service:
        condition: service_healthy

    networks:
      - platform
      - identity

volumes:
  platform-postgres-data:
  keycloak-postgres-data:
  kafka-data:

networks:
  platform:
  identity:
